<div id="DienteDiv" style="display: block; vertical-align: top; width: 100%;">
    <div class="card card-info">
        <div class="card-header">
            <h3 class="card-title">Caries</h3>
            <div class="card-tools">
                <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                    <i class="fas fa-minus"></i>
                </button>
            </div>
        </div>
        <div class="card-body p-0">
            <table border="0" style="width: 100%; border: 0px; border-collapse: collapse; border-spacing: 0px; border-style: none;">
                <tr>
                    <td colspan="3" style="border: 0px; width: 150px;">
                        <button class="btn btn-primary start" ID="Button2" Style="width: 100%; height: 60px; border-radius: 50% 50% 0% 0%; " Text="" OnClientClick="javascript:return ChangeColorArriba(this.id);" />
                    </td>
                    <td rowspan="3" style="border: 0px; text-align: left;">
                        <div class="icheck-primary d-inline">
                            <input type="checkbox" id="chkIzquierda" checked>
                            <label for="checkboxPrimary1">
                                Izquierda
                            </label>
                        </div>
                        <br />
                        <div class="icheck-primary d-inline">
                            <input type="checkbox" id="chkDerecha" checked>
                            <label for="checkboxPrimary1">
                                Derecha
                            </label>
                        </div>
                        <br />
                        <div class="icheck-primary d-inline">
                            <input type="checkbox" id="chkArriva" checked>
                            <label for="checkboxPrimary1">
                                Arriva
                            </label>
                        </div>
                        <br />
                        <div class="icheck-primary d-inline">
                            <input type="checkbox" id="chkAbajo" checked>
                            <label for="checkboxPrimary1">
                                Abajo
                            </label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="border: 0px; width: 50px;">
                        <button class="btn btn-primary start" ID="Button4" Style="width: 100%; height:60px;" Text="" onclick="ChangeColorIzquierda(this.id);" />
                    </td>
                    <td style="border: 0px; width: 50px;">
                        <button class="btn btn-primary start" ID="Button5" Style="width: 100%; height: 60px;" Text="" onclick="ChangeColorCentro(this.id);" />
                    </td>
                    <td style="border: 0px; width: 50px;">
                        <button class="btn btn-primary start" ID="Button6" Style="width: 100%; height: 60px;" Text="" onclick="ChangeColorDerecha(this.id);" />
                    </td>
                </tr>
                <tr>
                    <td colspan="3" style="border: 0px;">
                        <button class="btn btn-primary start" ID="Button3" Style="width: 100%; height: 60px; border-radius: 0% 0% 50% 50%; " Text="" onclick="ChangeColorAbajo(this.id);" />
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
